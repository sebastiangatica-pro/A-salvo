<!doctype html>
<html lang="es">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mi aviso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
    <link rel="stylesheet" href="css/tema.css">
    <link rel="stylesheet" href="css/estilos.css">
  </head>

  <body>
    <main class="container py-5">
      <h1 class="mb-4">Mi aviso</h1>
      <p class="text-secondary mb-4">Personaliza el mensaje que compartirás con tus contactos.</p>

      <section class="card mb-4" aria-labelledby="aviso-mensaje-titulo">
        <div class="card-body">
          <h2 class="h5 mb-3" id="aviso-mensaje-titulo">Mensaje</h2>
          <label class="form-label" for="aviso-mensaje">Escribe tu aviso</label>
          <textarea
            class="form-control"
            id="aviso-mensaje"
            name="mensaje"
            rows="5"
            maxlength="160"
            data-aviso-mensaje
            aria-describedby="aviso-contador aviso-validacion"
          ></textarea>
          <div class="d-flex justify-content-between align-items-start mt-2">
            <p class="small mb-0" id="aviso-validacion" data-aviso-validacion aria-live="polite">
              El mensaje no puede estar vacío.
            </p>
            <span class="small text-secondary ms-3" id="aviso-contador" data-aviso-contador>
              0 / 160
            </span>
          </div>
        </div>
      </section>

      <section class="card mb-4" aria-labelledby="aviso-frases-titulo">
        <div class="card-body">
          <h2 class="h5 mb-3" id="aviso-frases-titulo">Frases rápidas</h2>
          <div class="d-grid gap-2">
            <button type="button" class="btn btn-outline-primary text-start" data-aviso-frase="Estoy a salvo. Estoy bien y en un lugar seguro.">
              Estoy a salvo
            </button>
            <button type="button" class="btn btn-outline-primary text-start" data-aviso-frase="Necesito ayuda. Estoy en un lugar seguro y espero apoyo.">
              Necesito ayuda
            </button>
            <button type="button" class="btn btn-outline-primary text-start" data-aviso-frase="Estoy bien, pero no puedo comunicarme por teléfono.">
              Sin cobertura telefónica
            </button>
          </div>
        </div>
      </section>

      <div class="d-grid gap-2">
        <button type="button" class="btn btn-primary" data-aviso-sms disabled>
          Abrir mensajes
        </button>
        <button type="button" class="btn btn-outline-primary" data-aviso-copiar disabled>
          Copiar aviso
        </button>
      </div>
      <p class="small text-center mt-3 visually-hidden" data-aviso-status role="status" aria-live="polite"></p>
    </main>

    <nav class="bottom-nav fixed-bottom" aria-label="Navegación principal">
      <a class="bottom-nav__item" href="index.html">
        <i class="bi bi-house" aria-hidden="true"></i><span>Inicio</span>
      </a>
      <a class="bottom-nav__item" href="kit.html">
        <i class="bi bi-clipboard-check" aria-hidden="true"></i><span>Kit</span>
      </a>
      <a class="bottom-nav__item" href="plan_familiar.html">
        <i class="bi bi-geo-alt" aria-hidden="true"></i><span>Plan</span>
      </a>
      <a class="bottom-nav__item" href="contactos.html">
        <i class="bi bi-people" aria-hidden="true"></i><span>Contactos</span>
      </a>
      <a class="bottom-nav__item active" href="mi_aviso.html" aria-current="page">
        <i class="bi bi-chat-text" aria-hidden="true"></i><span>Mi aviso</span>
      </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
  </body>

</html>
