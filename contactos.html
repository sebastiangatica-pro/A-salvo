<!doctype html>
<html lang="es">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Contactos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/tema.css">
    <link rel="stylesheet" href="css/estilos.css">
  </head>

  <body>
    <main class="container py-5">
      <h1 class="mb-2">Contactos</h1>
      <p class="text-secondary mb-4">Guarda a las personas a quienes avisarás en una emergencia.</p>

      <section class="card mb-4" aria-labelledby="agregar-contacto-titulo">
        <div class="card-body">
          <h2 class="h5 mb-3" id="agregar-contacto-titulo">Agregar contacto</h2>
          <form id="form-contacto" novalidate>
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" maxlength="80" required aria-describedby="error-nombre">
              <div class="invalid-feedback" id="error-nombre">Ingresa el nombre del contacto.</div>
            </div>

            <div class="mb-3">
              <label for="telefono" class="form-label">Teléfono celular</label>
              <input type="tel" class="form-control" id="telefono" inputmode="numeric" maxlength="9" placeholder="912345678" required aria-describedby="ayuda-telefono error-telefono">
              <div class="form-text" id="ayuda-telefono">Ingresa 9 dígitos, comenzando por 9.</div>
              <div class="invalid-feedback" id="error-telefono">El teléfono debe tener 9 dígitos y comenzar por 9.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Guardar contacto</button>
          </form>
        </div>
      </section>

      <section aria-labelledby="mis-contactos-titulo">
        <h2 class="h5 mb-3" id="mis-contactos-titulo">Mis contactos</h2>
        <p id="contactos-estado" class="text-secondary" role="status" aria-live="polite"></p>
        <div id="lista-contactos" class="row g-3"></div>
      </section>
    </main>

    <nav class="bottom-nav fixed-bottom" aria-label="Navegación principal">
      <a class="bottom-nav__item" href="inicio.html">
        <i class="bi bi-house" aria-hidden="true"></i><span>Inicio</span>
      </a>
      <a class="bottom-nav__item" href="kit.html">
        <i class="bi bi-clipboard-check" aria-hidden="true"></i><span>Kit</span>
      </a>
      <a class="bottom-nav__item" href="plan_familiar.html">
        <i class="bi bi-geo-alt" aria-hidden="true"></i><span>Plan</span>
      </a>
      <a class="bottom-nav__item active" href="contactos.html" aria-current="page">
        <i class="bi bi-people" aria-hidden="true"></i><span>Contactos</span>
      </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
  </body>

</html>
