<!doctype html>
<html lang="es">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/tema.css">
    <link rel="stylesheet" href="css/estilos.css">
  </head>

  <body>
    <main class="container py-5">
      <h1 class="mb-4">Kit</h1>
      <p class="mb-4">Prepara estos elementos para tener lo esencial a mano durante una emergencia.</p>
      <section class="card mb-4" data-kit-progress aria-label="Avance de tu kit">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-semibold">Elementos listos</span>
            <span class="fw-semibold" data-kit-count>0 de 14</span>
          </div>
          <div class="progress" role="progressbar" aria-label="Avance del kit" aria-valuemin="0" aria-valuemax="14" aria-valuenow="0">
            <div class="progress-bar" data-kit-bar style="width: 0%"></div>
          </div>
        </div>
      </section>
      <p class="visually-hidden" data-kit-status role="status" aria-live="polite"></p>
      <div class="accordion" id="kit-accordion" data-kit-checklist></div>
    </main>

    <nav class="bottom-nav fixed-bottom" aria-label="Navegación principal">
      <a class="bottom-nav__item" href="inicio.html">
        <i class="bi bi-house" aria-hidden="true"></i><span>Inicio</span>
      </a>
      <a class="bottom-nav__item active" href="kit.html" aria-current="page">
        <i class="bi bi-clipboard-check" aria-hidden="true"></i><span>Kit</span>
      </a>
      <a class="bottom-nav__item" href="plan_familiar.html">
        <i class="bi bi-geo-alt" aria-hidden="true"></i><span>Plan</span>
      </a>
      <a class="bottom-nav__item" href="contactos.html">
        <i class="bi bi-people" aria-hidden="true"></i><span>Contactos</span>
      </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
  </body>

</html>
