<!doctype html>
<html lang="es">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Plan familiar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/tema.css">
    <link rel="stylesheet" href="css/estilos.css">
  </head>

  <body>
    <main class="container py-5">
      <h1 class="mb-4">Plan familiar</h1>
      <p class="text-secondary mb-4">Define dónde reunirse y la responsabilidad de cada contacto.</p>

      <form data-plan-form novalidate>
        <section class="card mb-4" aria-labelledby="punto-encuentro-titulo">
          <div class="card-body">
            <h2 class="h5 mb-3" id="punto-encuentro-titulo">Punto de encuentro</h2>
            <label class="form-label" for="punto-encuentro">Lugar acordado</label>
            <input
              type="text"
              class="form-control"
              id="punto-encuentro"
              maxlength="120"
              data-punto-encuentro
              aria-describedby="punto-encuentro-validacion"
              required
            >
            <div class="invalid-feedback" id="punto-encuentro-validacion">
              Indica el punto de encuentro familiar.
            </div>
          </div>
        </section>

        <section class="card mb-4" aria-labelledby="tareas-titulo">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h5 mb-0" id="tareas-titulo">Tarea por contacto</h2>
              <span class="small text-secondary" data-plan-contador>0 contactos</span>
            </div>
            <div data-plan-tareas>
              <p class="text-secondary mb-0">Cargando contactos...</p>
            </div>
            <a class="btn btn-outline-primary mt-3" href="contactos.html" data-plan-sin-contactos hidden>
              Agregar contactos
            </a>
          </div>
        </section>

        <button type="submit" class="btn btn-primary w-100" data-plan-guardar>
          Guardar plan
        </button>
      </form>
      <p class="small mt-3 visually-hidden" data-plan-status role="status" aria-live="polite"></p>
    </main>

    <nav class="bottom-nav fixed-bottom" aria-label="Navegación principal">
      <a class="bottom-nav__item" href="inicio.html">
        <i class="bi bi-house" aria-hidden="true"></i><span>Inicio</span>
      </a>
      <a class="bottom-nav__item" href="kit.html">
        <i class="bi bi-clipboard-check" aria-hidden="true"></i><span>Kit</span>
      </a>
      <a class="bottom-nav__item active" href="plan_familiar.html" aria-current="page">
        <i class="bi bi-geo-alt" aria-hidden="true"></i><span>Plan</span>
      </a>
      <a class="bottom-nav__item" href="contactos.html">
        <i class="bi bi-people" aria-hidden="true"></i><span>Contactos</span>
      </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
  </body>

</html>
