<!doctype html>
<html lang="es">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>A Salvo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/tema.css">
    <link rel="stylesheet" href="css/estilos.css">
  </head>

  <body class="d-flex flex-column">
    <main class="container py-5">
      <h1 class="mb-4"><i class="bi bi-check-square-fill text-primary"></i> A Salvo</h1>
    </main>
    <div class="container flex-grow-1 d-flex flex-column justify-content-center align-items-center pb-5">
      <h2 class="mb-5">Avísales que estás bien</h2>
      <a href="mi_aviso.html" class="btn btn-primary btn-circle btn-circle-lg btn-pulse">
          <i class="bi bi-check-lg fs-1 lh-3" aria-hidden="true"></i>
          <span class="fw-bold fs-6 lh-sm">ESTOY</span>
          <span class="fw-bold fs-6 lh-sm">A SALVO</span>
      </a>
      <section class="card w-100 mt-5" data-kit-progress aria-labelledby="kit-progress-title">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="h5 mb-0" id="kit-progress-title">Tu kit de emergencia</h2>
            <span class="fw-semibold" data-kit-count>0 de 14</span>
          </div>
          <div class="progress" role="progressbar" aria-label="Avance del kit" aria-valuemin="0" aria-valuemax="14" aria-valuenow="0">
            <div class="progress-bar" data-kit-bar style="width: 0%"></div>
          </div>
          <a class="btn btn-outline-primary btn-sm mt-3" href="kit.html">Revisar mi kit</a>
        </div>
      </section>
      <p class="visually-hidden" data-kit-status role="status" aria-live="polite"></p>
    </div>
    
    <nav class="bottom-nav fixed-bottom" aria-label="Navegación principal">
      <a class="bottom-nav__item active" href="index.html" aria-current="page">
        <i class="bi bi-house" aria-hidden="true"></i><span>Inicio</span>
      </a>
      <a class="bottom-nav__item" href="kit.html">
        <i class="bi bi-clipboard-check" aria-hidden="true"></i><span>Kit</span>
      </a>
      <a class="bottom-nav__item" href="plan_familiar.html">
        <i class="bi bi-geo-alt" aria-hidden="true"></i><span>Plan</span>
      </a>
      <a class="bottom-nav__item" href="contactos.html">
        <i class="bi bi-people" aria-hidden="true"></i><span>Contactos</span>
      </a>
      <a class="bottom-nav__item" href="mi_aviso.html">
        <i class="bi bi-chat-text" aria-hidden="true"></i><span>Mi aviso</span>
      </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
  </body>

</html>
